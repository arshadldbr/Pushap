<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitHub Pusher — Class Tool</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <meta name="theme-color" content="#2563eb" />
  <style>
    :root {
      --accent: #2563eb;
      --bg: #f8fafc;
      --border: #e2e8f0;
      --text: #1e293b;
      --muted: #64748b;
      --success: #16a34a;
      --error: #dc2626;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
    }
    .card {
      max-width: 480px;
      margin: 0 auto;
      background: white;
      border-radius: 20px;
      padding: 24px 20px;
      box-shadow: 0 10px 30px -10px rgba(0,0,0,0.15);
    }
    h1 {
      font-size: 18px;
      margin: 0 0 4px;
    }
    p.sub {
      color: var(--muted);
      font-size: 13px;
      margin: 0 0 20px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin: 14px 0 6px;
    }
    input, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
    }
    input:focus, textarea:focus {
      border-color: var(--accent);
    }
    textarea {
      min-height: 160px;
      resize: vertical;
      font-family: ui-monospace, monospace;
      font-size: 12.5px;
    }
    button {
      width: 100%;
      margin-top: 18px;
      padding: 13px;
      border: none;
      border-radius: 12px;
      background: var(--accent);
      color: white;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    #status {
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
      display: none;
    }
    #status.success {
      display: block;
      background: #f0fdf4;
      color: var(--success);
      border: 1px solid #bbf7d0;
    }
    #status.error {
      display: block;
      background: #fef2f2;
      color: var(--error);
      border: 1px solid #fecaca;
    }
    #status a {
      color: inherit;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>📤 GitHub Pusher</h1>
    <p class="sub">Apna access code, file ka path, aur content daal kar seedha class ki practice repo mein push karein.</p>

    <label>Access Code</label>
    <input type="text" id="code" placeholder="Aapka code" autocapitalize="off" />

    <label>File Path (jaisa: src/App.tsx)</label>
    <input type="text" id="filePath" placeholder="src/App.tsx" autocapitalize="off" />

    <label>File Content</label>
    <textarea id="content" placeholder="Yahan Claude se mila hua code/content paste karein"></textarea>

    <label>Commit Message (optional)</label>
    <input type="text" id="commitMessage" placeholder="Update App.tsx" />

    <button id="submitBtn">Push to GitHub</button>

    <div id="status"></div>
  </div>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js").catch(() => {});
      });
    }

    const submitBtn = document.getElementById("submitBtn");
    const statusDiv = document.getElementById("status");

    submitBtn.addEventListener("click", async () => {
      const code = document.getElementById("code").value.trim();
      const filePath = document.getElementById("filePath").value.trim();
      const content = document.getElementById("content").value;
      const commitMessage = document.getElementById("commitMessage").value.trim();

      statusDiv.className = "";
      statusDiv.textContent = "";

      if (!code || !filePath || !content) {
        statusDiv.className = "error";
        statusDiv.textContent = "Access code, file path, aur content zaroori hain.";
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Pushing...";

      try {
        const response = await fetch("/api/push", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ code, filePath, content, commitMessage }),
        });
        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(data.error || "Push failed.");
        }

        statusDiv.className = "success";
        statusDiv.innerHTML = `✅ Kamyabi se push ho gaya!${
          data.commitUrl ? ` <a href="${data.commitUrl}" target="_blank">Commit dekhein</a>` : ""
        }`;
      } catch (err) {
        statusDiv.className = "error";
        statusDiv.textContent = "❌ " + (err.message || "Kuch ghalat ho gaya.");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Push to GitHub";
      }
    });
  </script>
</body>
</html>
